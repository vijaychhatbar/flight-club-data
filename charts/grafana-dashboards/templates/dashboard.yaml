apiVersion: v1
kind: ConfigMap
metadata:
  name: aviation-pipeline-dashboard
  namespace: {{ .Values.namespace }}
  labels:
    grafana_dashboard: "1"
data:
  aviation-pipeline.json: |
    {
      "title": "Aviation Pipeline",
      "uid": "aviation-pipeline",
      "schemaVersion": 36,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "title": "Pod Memory Usage (MB)",
          "targets": [{
            "expr": "container_memory_working_set_bytes{namespace=~'kafka|dagster',container!='',container!='POD'} / 1024 / 1024",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }}/{{ "{{" }}container{{ "}}" }}"
          }],
          "fieldConfig": { "defaults": { "unit": "MB" } }
        },
        {
          "id": 2, "type": "timeseries", "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "title": "Pod CPU Usage (cores)",
          "targets": [{
            "expr": "rate(container_cpu_usage_seconds_total{namespace=~'kafka|dagster',container!='',container!='POD'}[2m])",
            "legendFormat": "{{ "{{" }}namespace{{ "}}" }}/{{ "{{" }}container{{ "}}" }}"
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 3, "type": "stat", "gridPos": { "x": 0, "y": 8, "w": 6, "h": 4 },
          "title": "Pod Restarts (total)",
          "targets": [{
            "expr": "sum(kube_pod_container_status_restarts_total{namespace=~'kafka|dagster'}) by (pod)",
            "legendFormat": "{{ "{{" }}pod{{ "}}" }}"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "fieldConfig": { "defaults": { "thresholds": { "steps": [
            { "color": "green", "value": 0 },
            { "color": "yellow", "value": 3 },
            { "color": "red", "value": 10 }
          ]}}}
        },
        {
          "id": 4, "type": "timeseries", "gridPos": { "x": 6, "y": 8, "w": 18, "h": 4 },
          "title": "Producer - Flights/s",
          "targets": [
            { "expr": "rate(producer_flights_fetched_total[2m])", "legendFormat": "fetched/s" },
            { "expr": "rate(producer_flights_sent_total[2m])",   "legendFormat": "sent/s" }
          ]
        },
        {
          "id": 5, "type": "timeseries", "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "title": "Producer - Validation & Kafka Errors/s",
          "targets": [
            { "expr": "rate(producer_validation_errors_total[2m])", "legendFormat": "validation errors/s" },
            { "expr": "rate(producer_kafka_errors_total[2m])",      "legendFormat": "kafka errors/s" }
          ],
          "fieldConfig": { "defaults": { "color": { "fixedColor": "red", "mode": "fixed" } } }
        },
        {
          "id": 6, "type": "timeseries", "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "title": "Consumer - Messages Consumed & Records Written/s",
          "targets": [
            { "expr": "rate(consumer_messages_consumed_total[2m])", "legendFormat": "consumed/s" },
            { "expr": "rate(consumer_records_written_total[2m])",   "legendFormat": "written/s" }
          ]
        },
        {
          "id": 7, "type": "timeseries", "gridPos": { "x": 0, "y": 20, "w": 12, "h": 8 },
          "title": "Consumer - Buffer Size",
          "targets": [{
            "expr": "consumer_buffer_size",
            "legendFormat": "buffer"
          }],
          "fieldConfig": { "defaults": { "thresholds": { "steps": [
            { "color": "green", "value": 0 },
            { "color": "yellow", "value": 800 },
            { "color": "red", "value": 1000 }
          ]}}}
        },
        {
          "id": 8, "type": "timeseries", "gridPos": { "x": 12, "y": 20, "w": 12, "h": 8 },
          "title": "Consumer - Validation & Iceberg Errors/s",
          "targets": [
            { "expr": "rate(consumer_validation_errors_total[2m])", "legendFormat": "validation errors/s" },
            { "expr": "rate(consumer_iceberg_errors_total[2m])",    "legendFormat": "iceberg errors/s" }
          ],
          "fieldConfig": { "defaults": { "color": { "fixedColor": "red", "mode": "fixed" } } }
        }
      ]
    }
